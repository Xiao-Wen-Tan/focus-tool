<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com http://127.0.0.1:* http://localhost:*; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Focus">
  <meta name="theme-color" content="#FFF7EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#26212B" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Focus Tool: your task list, timer and day plan on the phone.">
  <title>Focus Tool</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <span class="brand">🌱 Focus</span>
  </header>
  <main id="main" class="main">
    <noscript><p class="hint">This app needs JavaScript.</p></noscript>
  </main>
  <nav id="tabs" class="tabs" aria-label="Sections"></nav>
  <div id="sheet" class="sheet-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
